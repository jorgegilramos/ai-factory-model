# https://github.com/marketplace/actions/coveralls-github-action
on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

name: Test Coveralls

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # Step: Install dependencies
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install build>=1.2.2 setuptools>=78.1.0 flake8>=7.2.0 pytest>=8.3.5
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        if [ -f requirements_develop.txt ]; then pip install -r requirements_develop.txt; fi

    # Step: Run tests and generate coverage report
    - name: Run tests with coverage
      run: |
        coverage run -m pytest
        coverage xml  # generates coverage.xml

    # Step: Upload to Coveralls using Cobertura XML
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        format: cobertura
        file: coverage.xml
