# https://github.com/marketplace/actions/coveralls-github-action
on: ["push", "pull_request"]

name: Test Coveralls

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    # Step: Run tests and generate coverage report
    - name: Run tests with coverage
      run: |
        python -m pip install --upgrade pip
        python -m pip install build>=1.2.2 setuptools>=78.1.0 flake8>=7.2.0 pytest>=8.3.5 pytest-env>=1.1.5 coverage>=7.8.0
        coverage run -m pytest
        coverage xml  # generates coverage.xml

    # Step: Upload to Coveralls using Cobertura XML
    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      with:
        format: cobertura
        file: coverage.xml
